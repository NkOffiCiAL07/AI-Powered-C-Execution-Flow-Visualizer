services:
  - type: web
    name: traceon-backend
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 8000
      - key: RELOAD
        value: false
      - key: ALLOWED_ORIGINS
        value: https://frontend-gamma-vert-20.vercel.app,http://localhost:3000
      - key: FRONTEND_ORIGIN
        value: https://frontend-gamma-vert-20.vercel.app
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: OAUTH_REDIRECT_URI
        sync: false
